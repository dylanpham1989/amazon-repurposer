[project]
name = "amazon-repurposer"
version = "0.1.0"
description = "Lấy ảnh + title + mô tả từ Amazon, dán sticker, viết lại bằng AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
    "httpx[http2]>=0.28",
    "selectolax>=0.3.21",
    "pillow>=11.0",
    "boto3>=1.35",
    "itsdangerous>=2.2",
    "asyncpg>=0.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
